appId: com.cockpit.desktop
productName: Cockpit
directories:
  output: release
files:
  - dist/**
# The `cockpit` CLI the harness hooks run, built by `apps/cli`, sits in Contents/Resources/bin.
extraResources:
  - from: ../cli/dist/cockpit
    to: bin/cockpit
# node-pty is N-API: its prebuilds load under Electron as they are. A rebuild
# would compile it in place in the shared Bun store.
npmRebuild: false
# node-pty's `pty.node` and `spawn-helper` must sit outside the asar to run.
asarUnpack:
  - node_modules/node-pty/**
mac:
  # Test-build defaults: ad-hoc signed, no hardened runtime. `package:signed` overrides both
  # (Developer ID, hardened runtime, notarization) in signed-app.yml.
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSAppleEventsUsageDescription: A program run in a Cockpit terminal wants to control another app.
