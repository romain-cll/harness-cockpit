appId: com.cockpit.desktop
productName: Cockpit
directories:
  output: release
files:
  - dist/**
# The `cockpit` CLI the harness hooks run, built by `apps/cli`, sits in Contents/Resources/bin.
extraResources:
  - from: ../cli/dist/cockpit
    to: bin/cockpit
# node-pty is N-API: its prebuilds load under Electron as they are. A rebuild
# would compile it in place in the shared Bun store.
npmRebuild: false
# node-pty's `pty.node` and `spawn-helper` must sit outside the asar to run.
asarUnpack:
  - node_modules/node-pty/**
mac:
  # Ad-hoc signed until a Developer ID certificate is set up for distribution.
  identity: '-'
  hardenedRuntime: false
