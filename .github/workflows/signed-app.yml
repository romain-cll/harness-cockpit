# Developer ID signed and notarized Cockpit.app (COCKPIT-17). The job runs in the GitHub environment
# `release`, the only place the five secrets are stored: CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID and APPLE_API_ISSUER. No pull_request trigger: a PR run never reads them.
name: Signed app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-app-${{ github.ref }}

jobs:
  signed-app:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # No secret reaches the build.
      - run: bun run --filter @cockpit/cli build && bun run --cwd apps/desktop build
      # The only step with the secrets, through `env:` alone. electron-builder notarizes and staples
      # once the APPLE_API_* variables are set.
      - name: Sign and notarize
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          bun run --cwd apps/desktop package:signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify
        run: |
          app=apps/desktop/release/mac-arm64/Cockpit.app
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          xcrun stapler validate "$app"
          codesign -d --entitlements - "$app/Contents/MacOS/Cockpit" 2>&1 | tee "$RUNNER_TEMP/main-entitlements.txt"
          for key in allow-jit device.audio-input device.camera automation.apple-events; do
            grep -q "com.apple.security.*$key" "$RUNNER_TEMP/main-entitlements.txt"
          done
          codesign -d --entitlements - "$app/Contents/Resources/bin/cockpit" 2>&1 | grep -q 'com.apple.security.cs.allow-jit'
      - run: bun run --cwd apps/desktop vitest run test/packaged.test.ts test/launchd.test.ts
      - name: Zip
        id: zip
        run: |
          ditto -c -k --keepParent apps/desktop/release/mac-arm64/Cockpit.app "$RUNNER_TEMP/Cockpit.zip"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: Cockpit-${{ steps.zip.outputs.short }}
          path: ${{ runner.temp }}/Cockpit.zip
          retention-days: 14
